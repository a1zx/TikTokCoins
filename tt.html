<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=428, initial-scale=1">
  <title>TikTok Balance Replica</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;900&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #ececf0; font-family: 'Inter', Arial, sans-serif;}
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;}
    .iphone-x {
      width: 393px; height: 852px;
      background: #fff;
      border-radius: 44px;
      box-shadow: 0 10px 56px #26263a35, 0 2px 0 #fff, 0 0 0 7px #e0e0eb;
      overflow: hidden;
      position: relative;
      display: flex; flex-direction: column;
    }
    .iphone-notch {
      width: 95px; height: 24px; background: #191921;
      border-bottom-left-radius: 13px; border-bottom-right-radius: 13px;
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 9;
    }
    .screen-inner { flex: 1; overflow-y: auto; margin-top: 43px; min-height: 100%; }
    .header-row {
      padding: 16px 0 9px 0;
      font-weight: 700;
      font-size: 1.10rem;
      color: #222;
      display: flex; align-items: center; gap: 10px;
      position: relative; justify-content: flex-start;
    }
    .back-arrow {
      font-size: 1.29rem;
      color: #222;
      background: none; border: none; cursor: pointer;
      margin-left: 22px; margin-right: 7px; font-weight: 700;
      opacity: 0.93;
    }
    .header-title {
      font-size: 1.11rem; font-weight: 700; letter-spacing: 0.01em; margin-top: 2px;
      flex: 1 1 0;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .edit-name-btn {
      background: none; border: none; cursor: pointer; margin-right: 19px; padding: 4px 3px 0 4px;
      font-size: 1.13em; opacity: 0.7; vertical-align: top;
      transition: opacity .13s;
    }
    .edit-name-btn:hover { opacity: 1; }
    /* Main Card */
    .main-card {
      background: #232328;
      border-radius: 20px;
      margin: 0 16px 0 16px;
      padding: 24px 19px 17px 19px;
      display: flex; flex-direction: column; gap: 17px;
      color: #fff;
      position: relative;
      box-shadow: 0 3px 34px #0a0a1120;
    }
    .coins-row {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .coins-block {
      display: flex; align-items: center; gap: 8px;
      margin-top: 2px;
    }
    .coin-icon { width: 23px; height: 23px; margin-bottom: 0.5px; }
    .coins-balance {
      font-size: 2.09rem; font-weight: 900; color: #fff; letter-spacing: 0.01em;
      margin-right: 2px; font-family: inherit;
    }
    .coin-label {
      font-size: 1rem; color: #fff; opacity: 0.79; font-weight: 600;
      margin-left: 3px;
    }
    .get-coins-btn {
      background: #fe2c55;
      color: #fff;
      border: none;
      padding: 13px 24px;
      border-radius: 13px;
      font-weight: 800;
      font-size: 1.08rem;
      box-shadow: 0 2px 18px #fe2c5516;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background .13s;
    }
    .get-coins-btn:active { background: #e82046; }
    /* LIVE card + MAP */
    .live-card {
      background: #18181d;
      border-radius: 15px;
      padding: 15px 16px 13px 16px;
      margin-top: 12px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 2px 12px #0e0e1811;
    }
    .live-row {
      display: flex; align-items: center; gap: 8px;
    }
    .live-icon { width: 22px; height: 22px; margin-right: 8px; }
    .live-label { font-size: 1.07em; font-weight: 700; color: #fff;}
    .live-balance { font-weight: 900; font-size: 1.09em; color: #ffe14d; margin-left: 7px; margin-right: 8px;}
    .live-others { margin-left:auto;font-size:1.03em;opacity:0.79;font-weight:700; color: #fff; margin-right: 13px;}
    .live-arrow { color: #aaa; font-size: 1.09rem; margin-left: 1px; }
    .map-block {
      margin: 11px 0 0 0;
      background: #191921;
      border-radius: 13px;
      padding: 0;
      overflow: hidden;
      min-height: 69px;
      max-height: 72px;
      display: flex; align-items: center;
      box-shadow: 0 1.5px 8px #0001;
      border: 1.5px solid #191921;
      position: relative;
    }
    .map-img {
      width: 100%; height: 72px; object-fit: cover;
      display: block; border-radius: 13px;
    }
    /* Recharge Card */
    .recharge-card {
      margin: 17px 16px 0 16px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 14px #eeeef812;
      padding: 16px 18px 15px 14px;
      display: flex; align-items: center; gap: 10px; position: relative;
    }
    .recharge-icon { width: 27px; margin-right: 5px;}
    .recharge-info { flex: 1; display: flex; flex-direction: column;}
    .recharge-title { font-weight: 800; font-size: 1.03rem; color: #181a23;}
    .recharge-desc { font-size: 0.97em; color: #fe2c55; font-weight: 600; margin-top: 1px;}
    .recharge-btn {
      background: #fe2c55; color: #fff; border: none;
      border-radius: 12px; font-weight: 800; font-size: 1.02rem;
      padding: 9px 18px; box-shadow: 0 2px 12px #fe2c5510;
      cursor: pointer; transition: background .14s;
      font-family: inherit;
    }
    .recharge-btn:active { background: #e82046;}
    /* Services */
    .services-title {
      margin: 22px 24px 3px 24px;
      color: #20222b; font-size: 1.09rem;
      font-weight: 700; letter-spacing: 0.01em;
    }
    .services-block {
      margin: 6px 16px 0 16px;
      display: flex; gap: 11px;
    }
    .service-card {
      flex: 1 1 0;
      background: #fff;
      border-radius: 13px;
      box-shadow: 0 2px 14px #bbb5f813;
      padding: 19px 7px 13px 13px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      min-width: 0;
    }
    .service-card svg { opacity: 0.74;}
    .service-title {
      font-weight:800; font-size: 1.08rem; margin-top: 6px; color: #161b25;
      letter-spacing: 0.01em;
    }
    /* Modal / Overlay */
    .modal-bg {
      position: fixed; top:0;left:0;right:0;bottom:0;
      background: rgba(52,52,58,0.15);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn .12s;
    }
    @keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }
    .modal-content {
      background: #fff; border-radius: 17px; min-width: 84vw; max-width: 325px;
      padding: 26px 16px 23px 16px; position: relative;
      box-shadow: 0 2px 34px #fe2c5531;
      animation: pop .16s cubic-bezier(.77,-0.1,.59,1.13);
      display: flex; flex-direction: column; align-items: center;
      overflow: visible;
    }
    .modal-close {
      position: absolute; top: 13px; right: 16px;
      background: none; border: none;
      font-size: 1.11rem; color: #bdbdc9; cursor: pointer; font-weight: bold;
    }
    .modal-title {
      font-size: 1.08rem; font-weight: 800; letter-spacing: .01em;
      color: #161b21; margin-bottom: 13px; text-align: center;
    }
    .coin-anim-stack {
      display: flex; align-items: flex-end; gap: 3px; margin: 10px 0 6px 0; min-height: 30px;
    }
    .coin-anim-stack img {
      width: 25px; height: 25px;
      box-shadow: 0 2px 12px #ffd60019;
      border-radius: 50%; transform: translateY(0);
      animation: drop .15s cubic-bezier(.58,1.2,.42,1.1);
    }
    @keyframes drop { from { transform: translateY(-22px) scale(1.21); opacity:0;} to { transform: translateY(0) scale(1); opacity:1;} }
    .modal-slider-wrap {
      width: 100%; margin: 7px 0 9px 0;
      display: flex; align-items: center; flex-direction: column; gap: 6px;
    }
    .modal-slider-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 3px;
    }
    .modal-slider {
      width: 100%; height: 5px; border-radius: 5px;
      background: linear-gradient(90deg,#fe2c55,#ffcb52 94%);
      appearance: none; outline: none; margin: 0; padding: 0;
    }
    .modal-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px; height: 17px; border-radius: 50%; background: #fff;
      border: 2px solid #fe2c55; cursor: pointer; box-shadow: 0 2px 6px #fe2c5531;
      margin-top: -6px;
    }
    .modal-slider::-moz-range-thumb {
      width: 17px; height: 17px; border-radius: 50%; background: #fff;
      border: 2px solid #fe2c55; cursor: pointer; box-shadow: 0 2px 6px #fe2c5531;
    }
    .modal-slider::-ms-thumb {
      width: 17px; height: 17px; border-radius: 50%; background: #fff;
      border: 2px solid #fe2c55; cursor: pointer; box-shadow: 0 2px 6px #fe2c5531;
    }
    .modal-slider:focus { outline: none;}
    .modal-slider-label {
      background: #fff;
      padding: 1.5px 8px 1.5px 8px;
      border-radius: 8px;
      color: #fe2c55;
      font-size: 1.02rem;
      font-weight: 900;
      box-shadow: 0 1.2px 4px #fe2c5532;
      margin-left: 6px; margin-top: 0;
    }
    .modal-confirm {
      background: linear-gradient(90deg,#fe2c55 65%,#ff896e);
      color: #fff; border: none;
      width: 100%; font-size: 1.07rem;
      padding: 12px 0; border-radius: 12px;
      font-weight: 800; cursor: pointer;
      box-shadow: 0 2px 8px #fe2c5511;
      transition: background .13s;
      margin-top: 13px;
      letter-spacing: 0.03em;
    }
    .modal-confirm:active { opacity: 0.94; }
    /* Edit name modal */
    .edit-name-modal {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 24px #3d3d5830;
      padding: 27px 19px 19px 19px;
      min-width: 78vw; max-width: 320px;
      display: flex; flex-direction: column; align-items: center;
      animation: pop .15s cubic-bezier(.7,-0.06,.49,1.4);
      position: relative;
    }
    .edit-name-modal input {
      font-size: 1.05rem; padding: 8px 11px;
      border-radius: 10px; border: 1.6px solid #e5e5ef;
      margin-bottom: 17px; width: 100%;
      outline: none; font-family: inherit;
      transition: border .13s;
    }
    .edit-name-modal input:focus { border-color: #fe2c55;}
    .edit-name-modal .modal-title { font-size: 1.08rem;}
    .edit-name-modal .modal-confirm {
      margin-top: 0;
    }
    @keyframes pop { from { transform: scale(0.88);} to { transform: scale(1);} }
    .coin-balance-anim { color: #fe2c55 !important; transition: color .17s; }
    /* Hide scrollbar for iPhone feel */
    .screen-inner::-webkit-scrollbar { display: none; }
    .screen-inner { -ms-overflow-style: none; scrollbar-width: none; }
    @media (max-width: 430px) {
      .iphone-x { width: 100vw; height: 100vh; border-radius: 0; }
      .screen-inner { margin-top: 41px; }
    }
  </style>
</head>
<body>
  <div class="iphone-x">
    <div class="iphone-notch"></div>
    <div class="screen-inner">
      <div class="header-row">
        <button class="back-arrow" aria-label="Back">&larr;</button>
        <span class="header-title" id="nickname">maris...arisi’s balance</span>
        <button class="edit-name-btn" id="edit-name-btn" aria-label="Edit name">&#9998;</button>
      </div>
      <div class="main-card">
        <div class="coins-row">
          <div class="coins-block">
            <img class="coin-icon" src="https://i.ibb.co/0RgSgLMG/tiktokcoin.webp" alt="coin">
            <span class="coins-balance" id="balance-val">4,465</span>
            <span class="coin-label">Coins</span>
          </div>
          <button class="get-coins-btn" id="get-coins-btn">Get Coins</button>
        </div>
        <div class="live-card">
          <div class="live-row">
            <img class="live-icon" src="https://i.ibb.co/0RgSgLMG/tiktokcoin.webp" alt="live">
            <span class="live-label">LIVE rewards</span>
            <span class="live-balance">598</span>
            <span class="live-others">Others</span>
            <span class="live-arrow">&gt;</span>
          </div>
          <div class="map-block">
            <img class="map-img" src="https://cdn.jsdelivr.net/gh/AlexNikonovAI/temp-tiktok/map.png" alt="map" onerror="this.src='https://raw.githubusercontent.com/AlexNikonovAI/temp-tiktok/main/map.png';">
          </div>
        </div>
      </div>
      <div class="recharge-card">
        <img class="recharge-icon" src="https://cdn.jsdelivr.net/gh/AlexNikonovAI/temp-tiktok/gift.png" alt="gift">
        <div class="recharge-info">
          <span class="recharge-title">First recharge package</span>
          <span class="recharge-desc">Get extra Coins and 99% off</span>
        </div>
        <button class="recharge-btn">Get</button>
      </div>
      <div class="services-title">Services</div>
      <div class="services-block">
        <div class="service-card">
          <svg width="28" height="28" fill="none" stroke="#222" stroke-width="1.6"><rect x="3" y="5" width="20" height="16" rx="3"/><path d="M3 9h20"/></svg>
          <div class="service-title">Transactions</div>
        </div>
        <div class="service-card">
          <svg width="28" height="28" fill="none" stroke="#222" stroke-width="1.5"><circle cx="13" cy="13" r="11"/><path d="M13 8v4.2l3 2.4"/><circle cx="13" cy="17" r="0.6" fill="#222"/></svg>
          <div class="service-title">Help & feedback</div>
        </div>
      </div>
    </div>
    <div id="modal-bg" class="modal-bg" style="display:none;"></div>
  </div>
  <script>
    // Ссылки на твои картинки (можно заменить на твои файлы/хостинг)
    const mapSrc = "https://raw.githubusercontent.com/AlexNikonovAI/temp-tiktok/main/map.png";
    const giftSrc = "https://raw.githubusercontent.com/AlexNikonovAI/temp-tiktok/main/gift.png";
    document.querySelector('.map-img').src = mapSrc;
    document.querySelector('.recharge-icon').src = giftSrc;

    let balance = 4465;
    let coinBalance = document.getElementById('balance-val');
    let modalBg = document.getElementById('modal-bg');
    function formatNum(num) { return num.toLocaleString('en-US'); }
    document.getElementById('get-coins-btn').onclick = showCoinModal;
    document.querySelector('.recharge-btn').onclick = showCoinModal;
    function showCoinModal() {
      let coinsToAdd = 0, maxCoins = 10000, step = 50;
      modalBg.innerHTML = `
        <div class="modal-content">
          <button class="modal-close" aria-label="Close">&times;</button>
          <div class="modal-title">Get more coins</div>
          <div class="coin-anim-stack" id="coin-stack"></div>
          <div class="modal-slider-wrap">
            <div class="modal-slider-row">
              <span style="color:#75768c;font-weight:700;font-size:1em;">Amount</span>
              <span class="modal-slider-label" id="add-val">0</span>
            </div>
            <input type="range" min="0" max="${maxCoins}" value="0" step="${step}" id="coin-slider" class="modal-slider">
          </div>
          <button class="modal-confirm" id="confirm-coins" disabled>Confirm</button>
        </div>
      `;
      modalBg.style.display = '';
      function renderStack(val) {
        let stack = document.getElementById('coin-stack');
        stack.innerHTML = '';
        let cnt = Math.min(Math.floor(val/step), 7);
        for (let i = 0; i < cnt; i++) {
          stack.innerHTML += `<img src="https://i.ibb.co/0RgSgLMG/tiktokcoin.webp" style="z-index:${10-i};margin-left:${i*4}px;margin-bottom:${i*1.7}px;">`;
        }
      }
      document.getElementById('coin-slider').oninput = function() {
        coinsToAdd = +this.value;
        document.getElementById('add-val').textContent = coinsToAdd;
        renderStack(coinsToAdd);
        document.getElementById('confirm-coins').disabled = coinsToAdd === 0;
      };
      renderStack(0);
      document.getElementById('confirm-coins').onclick = function() {
        modalBg.style.display = 'none';
        animateBalance(coinsToAdd);
      };
      modalBg.querySelector('.modal-close').onclick = function() {
        modalBg.style.display = 'none';
      };
    }
    function animateBalance(coins) {
      let start = balance, end = balance + coins, duration = 1000;
      let step = Math.ceil((end-start) / (duration/16)), cur = start, t = 0;
      let animClass = "coin-balance-anim";
      coinBalance.classList.add(animClass);
      let interval = setInterval(()=>{
        t++; cur += step;
        if ((step > 0 && cur >= end) || t > 60) { cur = end; clearInterval(interval); setTimeout(()=>{ coinBalance.classList.remove(animClass); },190);}
        coinBalance.textContent = formatNum(cur);
      }, 21);
      balance = end;
    }
    // Edit nickname
    let nicknameSpan = document.getElementById('nickname');
    document.getElementById('edit-name-btn').onclick = function() {
      modalBg.innerHTML = `
        <form class="edit-name-modal" onsubmit="return false;">
          <button class="modal-close" aria-label="Close">&times;</button>
          <div class="modal-title">Edit your balance title</div>
          <input type="text" id="nickname-input" maxlength="40" value="${nicknameSpan.textContent.replace(/'s balance$/,'')}">
          <button class="modal-confirm" id="save-nick" type="submit">Save</button>
        </form>
      `;
      modalBg.style.display = '';
      let inp = document.getElementById('nickname-input');
      setTimeout(()=>{inp.focus();}, 150);
      document.getElementById('save-nick').onclick = function(e) {
        let val = inp.value.trim();
        if(val.length > 0) nicknameSpan.textContent = val + "'s balance";
        modalBg.style.display = 'none';
      }
      modalBg.querySelector('.modal-close').onclick = function() {
        modalBg.style.display = 'none';
      };
    }
    // Modal: prevent scroll
    modalBg.addEventListener('touchmove', e=>{if(modalBg.style.display!=='none')e.preventDefault();},{passive:false});
    document.querySelector('.back-arrow').onclick = () => { alert('← Back pressed'); }
  </script>
</body>
</html>
