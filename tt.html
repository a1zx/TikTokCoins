<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=430, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>TikTok Balance Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; min-height: 100vh;
      background: #111114; font-family: 'Inter', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh; width: 100vw;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    }
    .phone-container {
      width: 100vw; max-width: 428px; min-height: 100vh;
      background: #000; border-radius: 0;
      box-shadow: none; position: relative;
      display: flex; flex-direction: column; align-items: stretch;
      padding-bottom: 80px;
    }
    .header-row {
      padding: 22px 0 15px 0;
      font-weight: 800;
      font-size: 1.23rem;
      color: #fff;
      display: flex; align-items: center; gap: 7px;
      position: relative; justify-content: flex-start;
    }
    .back-arrow {
      font-size: 1.18rem;
      color: #fff;
      background: none; border: none; cursor: pointer;
      margin-left: 17px; margin-right: 8px; font-weight: 700;
      opacity: 0.96;
      padding: 0 6px;
    }
    .header-title {
      font-size: 1.15rem; font-weight: 800; letter-spacing: 0.01em;
      flex: 1 1 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .edit-name-btn {
      background: none; border: none; cursor: pointer; margin-right: 16px; padding: 4px 3px 0 4px;
      font-size: 1.09em; opacity: 0.7; vertical-align: top; transition: opacity .13s;
    }
    .edit-name-btn:hover { opacity: 1; }
    .main-card {
      background: #19191d;
      border-radius: 15px;
      margin: 0 12px 0 12px;
      padding: 23px 18px 12px 18px;
      display: flex; flex-direction: column; gap: 11px;
      color: #fff;
      position: relative;
      box-shadow: 0 3px 25px #09090914;
    }
    .coins-row {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .coins-block {
      display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
    }
    .coin-title-row {
      display: flex; align-items: center; gap: 7px; font-size: 1.02em; color: #fff; opacity: 0.83; font-weight: 500; margin-bottom: 3px;
    }
    .coin-icon {
      width: 19px; height: 19px; vertical-align: middle; margin-right: 2px; margin-bottom: 2px;
    }
    .coins-balance {
      font-size: 2.12rem; font-weight: 900; color: #fff; letter-spacing: 0.01em;
      font-family: inherit; margin-bottom: 2px; display: inline-block;
    }
    .get-coins-btn {
      background: none;
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 1.02rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      padding: 0;
      margin-top: 2px;
      opacity: 0.93;
      display: flex; align-items: center; gap: 2px;
      transition: opacity .13s;
    }
    .get-coins-btn:hover { opacity: 1; text-decoration: underline; }
    .main-card hr {
      border: none; border-top: 1.3px solid #29292e;
      margin: 12px 0 7px 0;
    }
    .est-row {
      display: flex; align-items: center; justify-content: space-between; margin: 0 1px 0 1px;
    }
    .est-label { color: #c5c5d0; font-size: 1.05em; font-weight: 500;}
    .est-balance {
      display: flex; align-items: center; gap: 7px;
      color: #fff; font-weight: 900; font-size: 1.17em; letter-spacing: .02em;
    }
    .est-money-img {
      width: 29px; height: 29px; margin-right: 2px; vertical-align: middle; object-fit: contain; border-radius: 7px;
      background: #19191d;
      box-shadow: 0 1px 6px #29292d23;
      border: 1px solid #242426;
    }
    .recharge-section {
      background: #19191d;
      border-radius: 13px;
      margin: 15px 12px 0 12px;
      padding: 16px 18px 15px 14px;
      display: flex; align-items: center; gap: 14px; position: relative;
      box-shadow: 0 2px 14px #292a3120;
    }
    .recharge-info { flex: 1; display: flex; flex-direction: column;}
    .recharge-title { font-weight: 800; font-size: 1.01rem; color: #fff;}
    .recharge-desc { font-size: 0.97em; color: #a2a2b7; font-weight: 600; margin-top: 2px;}
    .recharge-btn {
      background: #ff5c75;
      color: #fff; border: none;
      border-radius: 50%; font-weight: 900; font-size: 1.1rem;
      width: 46px; height: 46px; box-shadow: 0 1.7px 8px #fe2c5530;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      margin-left: 7px; margin-right: 2px; position: relative; z-index: 1;
      transition: background .14s; border: 2px solid #181818;
    }
    .recharge-btn:active { background: #fe2c55;}
    .recharge-btn svg { width: 26px; height: 26px;}
    .recharge-link {
      color: #ff5c75; font-weight: 700; background: none; border: none;
      font-size: 1em; margin: 0; padding: 0; cursor: pointer; text-decoration: underline;
      margin-top: 5px;
      transition: color .12s;
      display: inline-block;
    }
    .recharge-link:hover { color: #fe2c55; }
    .services-title {
      margin: 21px 20px 3px 20px;
      color: #fff; font-size: 1.07rem;
      font-weight: 800; letter-spacing: 0.01em;
    }
    .serv-row {
      background: #23232b;
      border-radius: 11px;
      color: #fff;
      margin: 8px 12px 0 12px;
      padding: 18px 13px 13px 16px;
      display: flex; align-items: center; gap: 13px;
      font-weight: 700; font-size: 1.05em;
      cursor: pointer; transition: background .13s;
    }
    .serv-row:hover { background: #19191d;}
    .serv-icn {
      width: 22px; height: 22px; opacity: 0.86; vertical-align: middle;
    }
    .modal-bg {
      position: fixed; top:0;left:0;right:0;bottom:0;
      background: rgba(20,20,24,0.32);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn .12s;
    }
    @keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }
    .modal-content {
      background: #18181c; border-radius: 17px; min-width: 83vw; max-width: 340px;
      padding: 26px 16px 23px 16px; position: relative;
      box-shadow: 0 2px 34px #22222d24;
      animation: pop .16s cubic-bezier(.77,-0.1,.59,1.13);
      display: flex; flex-direction: column; align-items: center;
      color: #fff;
    }
    .modal-close {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none;
      font-size: 1.13rem; color: #ccc; cursor: pointer; font-weight: bold;
    }
    .modal-title {
      font-size: 1.07rem; font-weight: 800; letter-spacing: .01em;
      color: #fff; margin-bottom: 13px; text-align: center;
    }
    .coin-anim-stack {
      display: flex; align-items: flex-end; gap: 3px; margin: 10px 0 6px 0; min-height: 30px;
    }
    .coin-anim-stack img {
      width: 24px; height: 24px; box-shadow: 0 2px 12px #ffd60019;
      border-radius: 50%; transform: translateY(0);
      animation: drop .15s cubic-bezier(.58,1.2,.42,1.1);
    }
    @keyframes drop { from { transform: translateY(-20px) scale(1.17); opacity:0;} to { transform: translateY(0) scale(1); opacity:1;} }
    .modal-slider-wrap {
      width: 100%; margin: 7px 0 11px 0; display: flex; align-items: center; flex-direction: column; gap: 5px;
    }
    .modal-slider-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
    }
    .modal-slider {
      width: 100%; height: 5px; border-radius: 5px;
      background: linear-gradient(90deg,#fe2c55,#ffcb52 94%);
      appearance: none; outline: none; margin: 0; padding: 0;
      touch-action: pan-x;
    }
    .modal-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px; height: 17px; border-radius: 50%; background: #fff;
      border: 2px solid #fe2c55; cursor: pointer; box-shadow: 0 2px 6px #fe2c5531; margin-top: -6px;
    }
    .modal-slider::-moz-range-thumb {
      width: 17px; height: 17px; border-radius: 50%; background: #fff;
      border: 2px solid #fe2c55; cursor: pointer; box-shadow: 0 2px 6px #fe2c5531;
    }
    .modal-slider::-ms-thumb {
      width: 17px; height: 17px; border-radius: 50%; background: #fff;
      border: 2px solid #fe2c55; cursor: pointer; box-shadow: 0 2px 6px #fe2c5531;
    }
    .modal-slider:focus { outline: none;}
    .modal-slider-label {
      background: #19191d; padding: 2.5px 11px 2.5px 11px; border-radius: 8px;
      color: #fe2c55; font-size: 1.04rem; font-weight: 900; box-shadow: 0 1.2px 4px #fe2c5531;
      margin-left: 7px; margin-top: 0;
    }
    .modal-confirm {
      background: linear-gradient(90deg,#fe2c55 65%,#ff896e);
      color: #fff; border: none;
      width: 100%; font-size: 1.07rem;
      padding: 12px 0; border-radius: 12px;
      font-weight: 800; cursor: pointer;
      box-shadow: 0 2px 8px #fe2c5511;
      transition: background .13s;
      margin-top: 14px; letter-spacing: 0.03em;
    }
    .modal-confirm:active { opacity: 0.94; }
    .edit-name-modal {
      background: #18181c; border-radius: 13px;
      box-shadow: 0 2px 24px #27273c33;
      padding: 23px 17px 18px 17px;
      min-width: 76vw; max-width: 290px;
      display: flex; flex-direction: column; align-items: center;
      animation: pop .14s cubic-bezier(.7,-0.06,.49,1.4);
      position: relative; color: #fff;
    }
    .edit-name-modal input {
      font-size: 1.07rem; padding: 8px 10px;
      border-radius: 9px; border: 1.5px solid #33343b;
      margin-bottom: 14px; width: 100%; background: #23232a; color: #fff;
      outline: none; font-family: inherit; transition: border .13s;
    }
    .edit-name-modal input:focus { border-color: #ff5c75;}
    .edit-name-modal .modal-title { font-size: 1.07rem;}
    .edit-name-modal .modal-confirm {
      margin-top: 0;
    }
    @keyframes pop { from { transform: scale(0.89);} to { transform: scale(1);} }
    .coin-balance-anim { color: #ff5c75 !important; transition: color .17s; }
    .footer-bg { width: 100vw; height: 600px; background: #000; }
    @media (max-width: 430px) {
      .phone-container { width: 100vw; max-width: 100vw; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="header-row">
      <button class="back-arrow" aria-label="Back">&larr;</button>
      <span class="header-title" id="nickname">NadeProCS2’s balance</span>
      <button class="edit-name-btn" id="edit-name-btn" aria-label="Edit name">
        <svg width="19" height="19" viewBox="0 0 24 24"><path fill="#fff" d="M19.7 7.1c.4-.4.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0l-1.2 1.2 2.8 2.8 1.2-1.2zm-3.3 2.1l-9 9V21h2.8l9-9-2.8-2.8z"></path></svg>
      </button>
    </div>
    <div class="main-card">
      <div class="coins-row">
        <div class="coins-block">
          <div class="coin-title-row">
            <img class="coin-icon" src="https://i.ibb.co/0RgSgLMG/tiktokcoin.webp" alt="coin">
            Coins
          </div>
          <span class="coins-balance" id="balance-val">0</span>
        </div>
        <button class="get-coins-btn" id="get-coins-btn">
          Get Coins <span style="font-size:1.05em;">&#8250;</span>
        </button>
      </div>
      <hr>
      <div class="est-row">
        <span class="est-label">Estimated balance</span>
        <span class="est-balance">
          <img class="est-money-img" src="https://i.ibb.co/hF03CTCC/Money-Emojis.png" alt="money icon">
          <span id="eur-balance">0.00</span>
        </span>
      </div>
    </div>
    <div class="recharge-section">
      <div class="recharge-info">
        <span class="recharge-title">First recharge package</span>
        <span class="recharge-desc">Get Gifts and bonus Coins</span>
        <button class="recharge-link" style="color:#ff5c75;font-size:1.01em;">Get &#8594;</button>
      </div>
      <button class="recharge-btn" aria-label="Gift">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="8" rx="2" fill="#fff"/><rect x="2" y="8" width="20" height="10" rx="3" fill="#ff5c75"/><path d="M8 10V6.5A2.5 2.5 0 0 1 13 6.5V10M16 10V6.5A2.5 2.5 0 0 0 11 6.5V10" stroke="#fff" stroke-width="1.2"/></svg>
      </button>
    </div>
    <div class="services-title">Services</div>
    <div class="serv-row">
      <svg class="serv-icn" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="1.7"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="M4 10h16"/></svg>
      Help & feedback
      <span style="margin-left:auto;">&#8250;</span>
    </div>
    <div class="footer-bg"></div>
    <div id="modal-bg" class="modal-bg" style="display:none;"></div>
  </div>
  <script>
    let nicknameSpan = document.getElementById('nickname');
    let modalBg = document.getElementById('modal-bg');
    let eurBalance = document.getElementById('eur-balance');
    let balance = 0;
    function formatNum(num) { return num.toLocaleString('en-US'); }
    document.getElementById('edit-name-btn').onclick = function() {
      modalBg.innerHTML = `
        <form class="edit-name-modal" onsubmit="return false;">
          <button class="modal-close" aria-label="Close">&times;</button>
          <div class="modal-title">Edit your balance title</div>
          <input type="text" id="nickname-input" maxlength="40" value="${nicknameSpan.textContent.replace(/'s balance$/,'')}">
          <button class="modal-confirm" id="save-nick" type="submit">Save</button>
        </form>
      `;
      modalBg.style.display = '';
      let inp = document.getElementById('nickname-input');
      setTimeout(()=>{inp.focus();}, 150);
      document.getElementById('save-nick').onclick = function(e) {
        let val = inp.value.trim();
        if(val.length > 0) nicknameSpan.textContent = val + "'s balance";
        modalBg.style.display = 'none';
      }
      modalBg.querySelector('.modal-close').onclick = function() {
        modalBg.style.display = 'none';
      };
    }
    document.getElementById('get-coins-btn').onclick = showCoinModal;
    function showCoinModal() {
      let coinsToAdd = 0, maxCoins = 100000, step = 50;
      modalBg.innerHTML = `
        <div class="modal-content">
          <button class="modal-close" aria-label="Close">&times;</button>
          <div class="modal-title">Get more coins</div>
          <div class="coin-anim-stack" id="coin-stack"></div>
          <div class="modal-slider-wrap">
            <div class="modal-slider-row">
              <span style="color:#75768c;font-weight:700;font-size:1em;">Amount</span>
              <span class="modal-slider-label" id="add-val">0</span>
            </div>
            <input type="range" min="0" max="${maxCoins}" value="0" step="${step}" id="coin-slider" class="modal-slider">
          </div>
          <button class="modal-confirm" id="confirm-coins" disabled>Confirm</button>
        </div>
      `;
      modalBg.style.display = '';
      function renderStack(val) {
        let stack = document.getElementById('coin-stack');
        stack.innerHTML = '';
        let cnt = Math.min(Math.floor(val/step), 7);
        for (let i = 0; i < cnt; i++) {
          stack.innerHTML += `<img src="https://i.ibb.co/0RgSgLMG/tiktokcoin.webp" style="z-index:${10-i};margin-left:${i*3}px;margin-bottom:${i*1.7}px;">`;
        }
      }
      document.getElementById('coin-slider').oninput = function() {
        coinsToAdd = +this.value;
        document.getElementById('add-val').textContent = coinsToAdd;
        renderStack(coinsToAdd);
        document.getElementById('confirm-coins').disabled = coinsToAdd === 0;
      };
      renderStack(0);
      document.getElementById('confirm-coins').onclick = function() {
        modalBg.style.display = 'none';
        animateBalance(coinsToAdd);
      };
      modalBg.querySelector('.modal-close').onclick = function() {
        modalBg.style.display = 'none';
      };
    }
    function animateBalance(coins) {
      let start = balance, end = balance + coins, duration = 3200;
      let step = Math.max(1, Math.ceil((end-start) / (duration/16)));
      let cur = start, t = 0;
      let animClass = "coin-balance-anim";
      let el = document.getElementById('balance-val');
      el.classList.add(animClass);
      let interval = setInterval(()=>{
        t++; cur += step;
        if ((step > 0 && cur >= end) || t > 250) { cur = end; clearInterval(interval); setTimeout(()=>{ el.classList.remove(animClass); },230);}
        el.textContent = formatNum(cur);
        eurBalance.textContent = (cur * 0.015).toFixed(2);
      }, 19);
      balance = end;
      eurBalance.textContent = (balance * 0.015).toFixed(2);
    }
    // Touchmove fix for slider
    modalBg.addEventListener('touchmove', function(e){
      // Если свайп по ползунку — не блокируем!
      if (e.target && e.target.classList && e.target.classList.contains('modal-slider')) return;
      if(modalBg.style.display!=='none') e.preventDefault();
    }, {passive:false});
    document.querySelector('.back-arrow').onclick = () => { alert('← Back pressed'); }
  </script>
</body>
</html>
