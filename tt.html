<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=430, initial-scale=1">
  <title>TikTok Dark Balance Clone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%; margin: 0; padding: 0; background: #111114;
      font-family: 'Inter', Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .iphone-x {
      width: 393px; height: 852px;
      background: #000;
      border-radius: 46px;
      box-shadow: 0 8px 60px #13151c50, 0 2px 0 #fff, 0 0 0 7px #24242a;
      overflow: hidden;
      position: relative;
      display: flex; flex-direction: column;
    }
    .iphone-notch {
      width: 99px; height: 22px; background: #1d1d21;
      border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 9;
    }
    .screen-inner { flex: 1; overflow-y: auto; margin-top: 38px; min-height: 100%; }
    .status-bar {
      height: 25px; color: #fff; font-size: 1.05em;
      letter-spacing: 0.08em; display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 22px 0 24px;
      opacity: 0.95;
      font-weight: 600;
    }
    .header-row {
      padding: 11px 0 13px 0;
      font-weight: 700;
      font-size: 1.22rem;
      color: #fff;
      display: flex; align-items: center; gap: 7px;
      position: relative; justify-content: flex-start;
    }
    .back-arrow {
      font-size: 1.21rem;
      color: #fff;
      background: none; border: none; cursor: pointer;
      margin-left: 18px; margin-right: 8px; font-weight: 700;
      opacity: 0.96;
    }
    .header-title {
      font-size: 1.17rem; font-weight: 800; letter-spacing: 0.01em; margin-top: 2px;
      flex: 1 1 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .edit-name-btn {
      background: none; border: none; cursor: pointer; margin-right: 15px; padding: 4px 3px 0 4px;
      font-size: 1.11em; opacity: 0.7; vertical-align: top;
      transition: opacity .13s;
    }
    .edit-name-btn:hover { opacity: 1; }
    .currency-row {
      display: flex; align-items: center; gap: 11px; margin-right: 20px;
    }
    .currency-icn {
      color: #fff; font-size: 1.15em; font-weight: 700; opacity: 0.87;
      background: none; border: none; cursor: pointer; padding: 0 2px;
      margin-right: 0;
    }
    /* Main Card */
    .main-card {
      background: #19191d;
      border-radius: 13px;
      margin: 0 11px 0 11px;
      padding: 22px 18px 9px 18px;
      display: flex; flex-direction: column; gap: 14px;
      color: #fff;
      position: relative;
      box-shadow: 0 3px 30px #09090917;
    }
    .coins-row {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .coins-block {
      display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
    }
    .coin-title-row {
      display: flex; align-items: center; gap: 7px; font-size: 1.02em; color: #fff; opacity: 0.83; font-weight: 500; margin-bottom: 3px;
    }
    .coin-icon {
      width: 19px; height: 19px;
      vertical-align: middle; margin-right: 2px;
      margin-bottom: 2px;
    }
    .coins-balance {
      font-size: 2.15rem; font-weight: 900; color: #fff; letter-spacing: 0.01em;
      font-family: inherit;
      margin-right: 6px;
      margin-bottom: 2px;
      display: inline-block;
    }
    .get-coins-btn {
      background: none;
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 1.03rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      padding: 0;
      margin-top: 2px;
      opacity: 0.92;
      display: flex; align-items: center; gap: 2px;
      transition: opacity .13s;
    }
    .get-coins-btn:hover { opacity: 1; text-decoration: underline; }
    .main-card hr {
      border: none; border-top: 1.3px solid #33343b;
      margin: 13px 0 9px 0;
    }
    .est-row {
      display: flex; align-items: center; justify-content: space-between; margin: 0 1px 0 1px;
    }
    .est-label { color: #c5c5d0; font-size: 1.04em; font-weight: 500;}
    .est-balance { color: #fff; font-weight: 900; font-size: 1.15em; letter-spacing: .02em;}
    .est-view-btn {
      background: none; color: #a7a7b2; border: none;
      font-weight: 700; font-size: 1.07em; cursor: pointer; letter-spacing: 0.01em;
      padding: 0; margin-left: 8px; opacity: 0.82; transition: opacity .13s;
    }
    .est-view-btn:hover { opacity: 1; text-decoration: underline;}
    .tikmark {
      position: absolute; right: 8px; bottom: 22px; opacity: 0.045; pointer-events: none;
      width: 200px; z-index: 1;
    }
    /* Section Block */
    .section {
      background: #19191d;
      border-radius: 13px;
      margin: 17px 11px 0 11px;
      box-shadow: 0 1.5px 14px #05051612;
    }
    .section-header {
      font-size: 1.15em; font-weight: 700; color: #fff;
      padding: 17px 17px 0 17px; margin-bottom: 3px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .section-viewall {
      font-size: 1em; color: #b1b1c0; font-weight: 700; background: none; border: none;
      cursor: pointer; opacity: 0.93; padding: 0;
      transition: opacity .13s;
    }
    .section-viewall:hover { opacity: 1; text-decoration: underline; }
    .section-body { padding: 0 0 7px 0; }
    /* Transactions */
    .trans-row {
      padding: 0 19px 17px 19px; color: #b5b6be;
      font-size: 1.07em;
      font-weight: 500;
    }
    /* Recharge Card */
    .recharge-section {
      background: #19191d;
      border-radius: 13px;
      margin: 15px 11px 0 11px;
      padding: 16px 18px 15px 15px;
      display: flex; align-items: center; gap: 14px; position: relative;
      box-shadow: 0 2px 14px #292a3120;
    }
    .recharge-info { flex: 1; display: flex; flex-direction: column;}
    .recharge-title { font-weight: 800; font-size: 1.01rem; color: #fff;}
    .recharge-desc { font-size: 0.97em; color: #a2a2b7; font-weight: 600; margin-top: 2px;}
    .recharge-btn {
      background: #ff5c75;
      color: #fff; border: none;
      border-radius: 50%; font-weight: 900; font-size: 1.1rem;
      width: 46px; height: 46px; box-shadow: 0 1.7px 8px #fe2c5530;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      margin-left: 7px; margin-right: 2px;
      position: relative; z-index: 1;
      transition: background .14s;
      border: 2px solid #181818;
    }
    .recharge-btn:active { background: #fe2c55;}
    .recharge-btn svg { width: 26px; height: 26px;}
    .recharge-link {
      color: #ff5c75; font-weight: 700; background: none; border: none;
      font-size: 1em; margin: 0; padding: 0; cursor: pointer; text-decoration: underline;
      margin-top: 5px;
      transition: color .12s;
      display: inline-block;
    }
    .recharge-link:hover { color: #fe2c55; }
    /* Monetization */
    .monet-row {
      background: #23232b;
      border-radius: 10px; color: #fff;
      margin: 10px 12px 10px 12px;
      padding: 17px 15px 13px 15px;
      display: flex; align-items: center; justify-content: space-between;
      font-weight: 700; font-size: 1.08em;
      cursor: pointer; transition: background .13s;
    }
    .monet-row:hover { background: #1b1b21;}
    .monet-icn {
      margin-right: 12px; width: 22px; height: 22px;
      opacity: 0.84; vertical-align: middle;
    }
    /* Services */
    .serv-row {
      background: #23232b;
      border-radius: 10px;
      color: #fff;
      margin: 8px 12px 12px 12px;
      padding: 18px 13px 13px 16px;
      display: flex; align-items: center; gap: 13px;
      font-weight: 700; font-size: 1.05em;
      cursor: pointer; transition: background .13s;
    }
    .serv-row:hover { background: #19191d;}
    .serv-icn {
      width: 22px; height: 22px; opacity: 0.86;
      vertical-align: middle;
    }
    /* Modal / Overlay */
    .modal-bg {
      position: fixed; top:0;left:0;right:0;bottom:0;
      background: rgba(52,52,58,0.17);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn .12s;
    }
    @keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }
    .modal-content {
      background: #18181c; border-radius: 16px; min-width: 82vw; max-width: 330px;
      padding: 27px 18px 21px 18px; position: relative;
      box-shadow: 0 2px 28px #1b1b2940;
      animation: pop .14s cubic-bezier(.77,-0.1,.59,1.13);
      display: flex; flex-direction: column; align-items: center;
      overflow: visible;
      color: #fff;
    }
    .modal-close {
      position: absolute; top: 13px; right: 15px;
      background: none; border: none;
      font-size: 1.12rem; color: #ccc; cursor: pointer; font-weight: bold;
    }
    .modal-title {
      font-size: 1.07rem; font-weight: 800; letter-spacing: .01em;
      color: #fff; margin-bottom: 13px; text-align: center;
    }
    .edit-name-modal {
      background: #18181c; border-radius: 13px;
      box-shadow: 0 2px 24px #27273c33;
      padding: 23px 17px 18px 17px;
      min-width: 76vw; max-width: 290px;
      display: flex; flex-direction: column; align-items: center;
      animation: pop .14s cubic-bezier(.7,-0.06,.49,1.4);
      position: relative; color: #fff;
    }
    .edit-name-modal input {
      font-size: 1.07rem; padding: 8px 10px;
      border-radius: 9px; border: 1.5px solid #33343b;
      margin-bottom: 14px; width: 100%; background: #23232a; color: #fff;
      outline: none; font-family: inherit; transition: border .13s;
    }
    .edit-name-modal input:focus { border-color: #ff5c75;}
    .edit-name-modal .modal-title { font-size: 1.07rem;}
    .edit-name-modal .modal-confirm {
      margin-top: 0;
    }
    @keyframes pop { from { transform: scale(0.89);} to { transform: scale(1);} }
    .coin-balance-anim { color: #ff5c75 !important; transition: color .19s; }
    .tikmark { display: none; }
    @media (max-width: 430px) {
      .iphone-x { width: 100vw; height: 100vh; border-radius: 0; }
      .screen-inner { margin-top: 37px; }
    }
  </style>
</head>
<body>
  <div class="iphone-x">
    <div class="iphone-notch"></div>
    <div class="screen-inner">
      <div class="status-bar">
        <span>12:28</span>
        <span style="opacity:.93;">EUR</span>
        <span style="font-size:1em;">
          <svg width="26" height="12" style="vertical-align:middle;margin-right:2px;">
            <rect x="2" y="2" width="16" height="8" rx="3" fill="#fff" stroke="#999" stroke-width="1"/>
            <rect x="18" y="5" width="2" height="2" rx="1" fill="#fff" />
            <rect x="4" y="3" width="12" height="6" rx="2" fill="#63d869"/>
          </svg>
          <span style="font-size:.97em;font-weight:700;vertical-align:middle;">73%</span>
        </span>
      </div>
      <div class="header-row">
        <button class="back-arrow" aria-label="Back">&larr;</button>
        <span class="header-title" id="nickname">NadeProCS2’s balance</span>
        <button class="edit-name-btn" id="edit-name-btn" aria-label="Edit name">
          <svg width="19" height="19" viewBox="0 0 24 24"><path fill="#fff" d="M19.7 7.1c.4-.4.4-1 0-1.4l-1.4-1.4c-.4-.4-1-.4-1.4 0l-1.2 1.2 2.8 2.8 1.2-1.2zm-3.3 2.1l-9 9V21h2.8l9-9-2.8-2.8z"></path></svg>
        </button>
        <button class="currency-icn" title="Switch currency">&#8646; EUR</button>
      </div>
      <div class="main-card">
        <div class="coins-row">
          <div class="coins-block">
            <div class="coin-title-row">
              <img class="coin-icon" src="https://i.ibb.co/0RgSgLMG/tiktokcoin.webp" alt="coin">
              Coins
            </div>
            <span class="coins-balance" id="balance-val">0</span>
          </div>
          <button class="get-coins-btn" id="get-coins-btn">
            Get Coins <span style="font-size:1.05em;">&#8250;</span>
          </button>
        </div>
        <hr>
        <div class="est-row">
          <span class="est-label">Estimated balance</span>
          <span style="display:flex;align-items:center;">
            <span style="font-size:1em;font-weight:900;letter-spacing:.02em;">EUR</span>
            <span class="est-balance" style="margin-left:2px;">0.00</span>
            <button class="est-view-btn">View &#8250;</button>
          </span>
        </div>
        <img src="https://svgshare.com/i/163B.svg" class="tikmark" alt="bg-tiktok-mark">
      </div>

      <div class="section">
        <div class="section-header">
          Transactions
          <button class="section-viewall">View all &#8250;</button>
        </div>
        <div class="section-body trans-row">
          <!-- Пусто, как на скрине -->
        </div>
      </div>

      <div class="recharge-section">
        <div class="recharge-info">
          <span class="recharge-title">First recharge package</span>
          <span class="recharge-desc">Get Gifts and bonus Coins</span>
          <button class="recharge-link" style="color:#ff5c75;font-size:1.01em;">Get &#8594;</button>
        </div>
        <button class="recharge-btn" aria-label="Gift">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="8" rx="2" fill="#fff"/><rect x="2" y="8" width="20" height="10" rx="3" fill="#ff5c75"/><path d="M8 10V6.5A2.5 2.5 0 0 1 13 6.5V10M16 10V6.5A2.5 2.5 0 0 0 11 6.5V10" stroke="#fff" stroke-width="1.2"/></svg>
        </button>
      </div>

      <div style="margin:17px 0 0 0;font-size:1.09em;font-weight:800;color:#fff;padding:0 25px 0 24px;">
        Monetization
        <button class="section-viewall" style="float:right;margin-top:2px;font-size:1em;">View more &#8250;</button>
      </div>
      <div class="monet-row">
        <span>
          <svg class="monet-icn" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/><path d="M16 12c0-2.21-1.79-4-4-4s-4 1.79-4 4" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="12" r="2.5" fill="#fff"/></svg>
          LIVE rewards
        </span>
        <span>&#8250;</span>
      </div>

      <div style="margin:19px 0 5px 0;font-size:1.09em;font-weight:800;color:#fff;padding:0 25px 0 24px;">
        Services
      </div>
      <div class="serv-row">
        <svg class="serv-icn" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="1.7"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="M4 10h16"/></svg>
        Help & feedback
        <span style="margin-left:auto;">&#8250;</span>
      </div>
    </div>
    <div id="modal-bg" class="modal-bg" style="display:none;"></div>
  </div>
  <script>
    // Никнейм и модалка
    let nicknameSpan = document.getElementById('nickname');
    let modalBg = document.getElementById('modal-bg');
    document.getElementById('edit-name-btn').onclick = function() {
      modalBg.innerHTML = `
        <form class="edit-name-modal" onsubmit="return false;">
          <button class="modal-close" aria-label="Close">&times;</button>
          <div class="modal-title">Edit your balance title</div>
          <input type="text" id="nickname-input" maxlength="40" value="${nicknameSpan.textContent.replace(/'s balance$/,'')}">
          <button class="modal-confirm" id="save-nick" type="submit">Save</button>
        </form>
      `;
      modalBg.style.display = '';
      let inp = document.getElementById('nickname-input');
      setTimeout(()=>{inp.focus();}, 150);
      document.getElementById('save-nick').onclick = function(e) {
        let val = inp.value.trim();
        if(val.length > 0) nicknameSpan.textContent = val + "'s balance";
        modalBg.style.display = 'none';
      }
      modalBg.querySelector('.modal-close').onclick = function() {
        modalBg.style.display = 'none';
      };
    }
    modalBg.addEventListener('touchmove', e=>{if(modalBg.style.display!=='none')e.preventDefault();},{passive:false});
    document.querySelector('.back-arrow').onclick = () => { alert('← Back pressed'); }
    // Кнопка "Get Coins"
    document.getElementById('get-coins-btn').onclick = function() {
      alert('Open coins purchase page!');
    }
    // Recharge Link
    document.querySelector('.recharge-link').onclick = function() {
      alert('Open recharge page!');
    }
  </script>
</body>
</html>
